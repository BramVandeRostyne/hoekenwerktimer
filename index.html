<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hoekenwerktimer</title><style>body{margin:0;background:#eef3fa;font-family:Arial,sans-serif;text-align:center}#top{padding:15px}input{font-size:20px;width:70px;padding:5px}button{font-size:20px;padding:10px 16px;margin:5px}svg{width:80vmin;height:80vmin}.time{font-size:60px;font-weight:bold}.status{font-size:28px;font-weight:bold}</style></head><body><div id="top">Werktijd <input id="work" type="number" value="8" min="1"> min &nbsp; Wisseltijd <input id="move" type="number" value="2" min="1"> min <button id="startBtn">START</button><button id="copyBtn">Kopieer link</button><button id="fsBtn">Fullscreen</button></div><svg viewBox="0 0 500 500"><circle cx="250" cy="250" r="180" fill="none" stroke="#2196F3" stroke-width="40" stroke-dasharray="905 226" transform="rotate(-90 250 250)"/><circle cx="250" cy="250" r="180" fill="none" stroke="#F44336" stroke-width="40" stroke-dasharray="226 905" stroke-dashoffset="-905" transform="rotate(-90 250 250)"/><line id="hand" x1="250" y1="250" x2="250" y2="90" stroke="#222" stroke-width="10"/><circle cx="250" cy="250" r="12" fill="#222"/><text id="emoji" x="250" y="180" text-anchor="middle" font-size="70">😊</text><text id="timer" x="250" y="275" text-anchor="middle" class="time">08:00</text><text id="status" x="250" y="330" text-anchor="middle" class="status">Klik op START</text></svg><script>let startTime=null,last='';function beep(n){const c=new(window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=900;o.start(c.currentTime+i*0.25);o.stop(c.currentTime+i*0.25+0.15);}}function parseHash(){if(location.hash.length>1){const p=location.hash.substring(1).split(',');startTime=parseInt(p[0]);document.getElementById('work').value=p[1];document.getElementById('move').value=p[2];document.getElementById('startBtn').style.display='none';}}parseHash();document.getElementById('startBtn').onclick=function(){let w=document.getElementById('work').value,m=document.getElementById('move').value;startTime=Math.floor(Date.now()/1000);location.hash=startTime+','+w+','+m;this.style.display='none';beep(1);};document.getElementById('copyBtn').onclick=()=>navigator.clipboard.writeText(location.href);document.getElementById('fsBtn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();};setInterval(()=>{if(!startTime)return;const W=parseInt(document.getElementById('work').value)*60,M=parseInt(document.getElementById('move').value)*60,T=W+M;let pos=(Math.floor(Date.now()/1000)-startTime)%T;let work=pos<W;let rem=work?W-pos:T-pos;let phase=work?'w':'m';if(last&&last!=phase){beep(phase==='m'?3:1);}last=phase;document.getElementById('timer').textContent=String(Math.floor(rem/60)).padStart(2,'0')+':'+String(rem%60).padStart(2,'0');document.getElementById('emoji').textContent=work?'😊':'👣';document.getElementById('status').textContent=work?'WERKEN':'DOORSCHUIVEN';document.getElementById('hand').setAttribute('transform','rotate('+(pos/T*360)+' 250 250)');},1000);</script></body></html>
