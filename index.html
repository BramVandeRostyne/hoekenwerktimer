<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hoekenwerktimer</title><style>body{margin:0;font-family:Arial,sans-serif;background:#eef3fa;display:flex;justify-content:center;align-items:center;height:100vh}svg{width:90vmin;height:90vmin}button{position:fixed;top:20px;padding:12px 20px;font-size:18px;border:none;border-radius:10px;color:white;cursor:pointer}#startBtn{left:20px;background:#4caf50}#fsBtn{right:20px;background:#1976d2}.time{font-size:60px;font-weight:bold;fill:#222}.status{font-size:28px;font-weight:bold;fill:#222}</style></head><body><button id="startBtn">START</button><button id="fsBtn">Fullscreen</button><svg viewBox="0 0 500 500"><circle cx="250" cy="250" r="180" fill="none" stroke="#2196F3" stroke-width="40" stroke-dasharray="905 226" transform="rotate(-90 250 250)"/><circle cx="250" cy="250" r="180" fill="none" stroke="#F44336" stroke-width="40" stroke-dasharray="226 905" stroke-dashoffset="-905" transform="rotate(-90 250 250)"/><line id="hand" x1="250" y1="250" x2="250" y2="90" stroke="#222" stroke-width="10" stroke-linecap="round"/><circle cx="250" cy="250" r="12" fill="#222"/><text id="emoji" x="250" y="180" text-anchor="middle" font-size="70">😊</text><text id="timer" x="250" y="275" text-anchor="middle" class="time">08:00</text><text id="status" x="250" y="335" text-anchor="middle" class="status">Klik op START</text></svg><script>const WORK=480,MOVE=120,TOTAL=600;let startTime=null,last='';document.getElementById('startBtn').onclick=()=>{if(!startTime){startTime=Math.floor(Date.now()/1000);document.getElementById('startBtn').style.display='none';update();setInterval(update,1000);}};document.getElementById('fsBtn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();};function bell(){try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=900;o.start();o.stop(a.currentTime+0.5);}catch(e){}}function update(){let pos=(Math.floor(Date.now()/1000)-startTime)%TOTAL;let work=pos<WORK;let rem=work?WORK-pos:TOTAL-pos;let m=Math.floor(rem/60),s=rem%60;document.getElementById('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');document.getElementById('emoji').textContent=work?'😊':'👣';document.getElementById('status').textContent=work?'WERKEN':'DOORSCHUIVEN';let phase=work?'w':'d';if(last&&last!==phase)bell();last=phase;document.getElementById('hand').setAttribute('transform','rotate('+(pos/TOTAL*360)+' 250 250)');}</script></body></html>
