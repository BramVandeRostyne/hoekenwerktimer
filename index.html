<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Hoekenwerktimer</title><style>body{margin:0;background:#dfe4ea;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh}button{position:fixed;top:20px;padding:15px 25px;border:none;border-radius:12px;color:white;font-size:24px;cursor:pointer}#startBtn{left:20px;background:#4CAF50}#fsBtn{right:20px;background:#1976D2}svg{width:90vmin;height:90vmin}.time{font-size:64px;font-weight:bold;fill:#222}.status{font-size:32px;font-weight:bold;fill:#222}</style></head><body><button id="startBtn">START</button><button id="fsBtn">Fullscreen</button><svg viewBox="0 0 500 500"><circle cx="250" cy="250" r="180" fill="none" stroke="#2196F3" stroke-width="40" stroke-dasharray="905 226" transform="rotate(-90 250 250)"/><circle cx="250" cy="250" r="180" fill="none" stroke="#F44336" stroke-width="40" stroke-dasharray="226 905" stroke-dashoffset="-905" transform="rotate(-90 250 250)"/><line id="hand" x1="250" y1="250" x2="250" y2="90" stroke="#222" stroke-width="10" stroke-linecap="round"/><circle cx="250" cy="250" r="12" fill="#222"/><text id="emoji" x="250" y="180" text-anchor="middle" font-size="70">😊</text><text id="timer" x="250" y="275" text-anchor="middle" class="time">08:00</text><text id="status" x="250" y="340" text-anchor="middle" class="status">Klik op START</text></svg><script>const WORK=480,TOTAL=600;let startTime=null;document.getElementById('startBtn').onclick=function(){startTime=Date.now();this.style.display='none';};document.getElementById('fsBtn').onclick=function(){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();};setInterval(function(){if(startTime===null)return;let elapsed=Math.floor((Date.now()-startTime)/1000);let pos=elapsed%TOTAL;let werken=pos<WORK;let resterend=werken?WORK-pos:TOTAL-pos;let m=Math.floor(resterend/60),s=resterend%60;document.getElementById('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');document.getElementById('emoji').textContent=werken?'😊':'👣';document.getElementById('status').textContent=werken?'WERKEN':'DOORSCHUIVEN';document.getElementById('hand').setAttribute('transform','rotate('+(pos/TOTAL*360)+' 250 250)');},1000);</script></body></html>
