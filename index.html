<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoekenwerktimer</title>

<style>
body{
    margin:0;
    background:#eef3fa;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

button{
    position:fixed;
    top:20px;
    padding:12px 20px;
    border:none;
    border-radius:10px;
    color:white;
    font-size:18px;
    cursor:pointer;
}

#startBtn{
    left:20px;
    background:#4CAF50;
}

#fsBtn{
    right:20px;
    background:#1976D2;
}

svg{
    width:90vmin;
    height:90vmin;
}

.time{
    font-size:60px;
    font-weight:bold;
    fill:#222;
}

.status{
    font-size:28px;
    font-weight:bold;
    fill:#222;
}
</style>
</head>

<body>

<button id="startBtn">START</button>
<button id="fsBtn">Fullscreen</button>

<svg viewBox="0 0 500 500">

    <!-- blauw -->
    <circle
        cx="250"
        cy="250"
        r="180"
        fill="none"
        stroke="#2196F3"
        stroke-width="40"
        stroke-dasharray="905 226"
        transform="rotate(-90 250 250)"
    />

    <!-- rood -->
    <circle
        cx="250"
        cy="250"
        r="180"
        fill="none"
        stroke="#F44336"
        stroke-width="40"
        stroke-dasharray="226 905"
        stroke-dashoffset="-905"
        transform="rotate(-90 250 250)"
    />

    <!-- wijzer -->
    <line
        id="hand"
        x1="250"
        y1="250"
        x2="250"
        y2="90"
        stroke="#222"
        stroke-width="10"
        stroke-linecap="round"
    />

    <circle cx="250" cy="250" r="12" fill="#222"/>

    <text
        id="emoji"
        x="250"
        y="180"
        text-anchor="middle"
        font-size="70">😊</text>

    <text
        id="timer"
        x="250"
        y="275"
        text-anchor="middle"
        class="time">08:00</text>

    <text
        id="status"
        x="250"
        y="335"
        text-anchor="middle"
        class="status">Klik op START</text>

</svg>

<script>

const WORK = 8 * 60;
const MOVE = 2 * 60;
const TOTAL = WORK + MOVE;

let startTime = null;
let previousPhase = "";

function bell(){

    try{

        const ctx =
            new (window.AudioContext || window.webkitAudioContext)();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.frequency.value = 900;
        gain.gain.value = 0.1;

        osc.start();
        osc.stop(ctx.currentTime + 0.5);

    }catch(e){}
}

function startTimer(){

    startTime = Math.floor(Date.now()/1000);

    location.hash = startTime;

    document.getElementById("startBtn").style.display = "none";
}

function update(){

    if(!startTime) return;

    const now = Math.floor(Date.now()/1000);

    const pos =
        (now - startTime) % TOTAL;

    const working = pos < WORK;

    const remain =
        working
        ? WORK - pos
        : TOTAL - pos;

    const mins = Math.floor(remain / 60);
    const secs = remain % 60;

    document.getElementById("timer").textContent =
        String(mins).padStart(2,
