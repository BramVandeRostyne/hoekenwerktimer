<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hoekenwerktimer v3</title><style>body{margin:0;background:#eef7ee;font-family:Arial,sans-serif;text-align:center}#top{padding:10px}input{width:70px;font-size:20px}button{font-size:18px;padding:8px 14px;margin:4px}svg{width:82vmin;height:82vmin}.time{font-size:58px;font-weight:bold}.label{font-size:26px;font-weight:bold}</style></head><body><div id="top">Werktijd <input id="work" type="number" value="8"> min Wisseltijd <input id="move" type="number" value="2"> min <button id="startBtn">START</button><button id="copyBtn">Kopieer link</button><button id="fsBtn">Fullscreen</button></div><svg viewBox="0 0 500 500"><circle cx="250" cy="250" r="180" fill="none" stroke="#ddd" stroke-width="40"/><circle id="blueArc" cx="250" cy="250" r="180" fill="none" stroke="#2eaf4a" stroke-width="40" transform="rotate(-90 250 250)"/><circle id="redArc" cx="250" cy="250" r="180" fill="none" stroke="#e53935" stroke-width="40" transform="rotate(-90 250 250)"/><line id="hand" x1="250" y1="250" x2="250" y2="90" stroke="#222" stroke-width="10"/><circle cx="250" cy="250" r="12" fill="#222"/><text id="line1" x="250" y="185" text-anchor="middle" class="label">😊 WERKEN</text><text id="line2" x="250" y="220" text-anchor="middle" class="label"></text><text id="timer" x="250" y="300" text-anchor="middle" class="time">08:00</text></svg><script>let startTime=null,last='';const C=2*Math.PI*180;function beep(n){try{const a=new(window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=a.createOscillator();o.connect(a.destination);o.frequency.value=850;o.start(a.currentTime+i*0.25);o.stop(a.currentTime+i*0.25+0.12);}}catch(e){}}function draw(){const w=+work.value,m=+move.value,t=w+m,b=C*(w/t),r=C*(m/t);blueArc.setAttribute('stroke-dasharray',b+' '+C);redArc.setAttribute('stroke-dasharray',r+' '+C);redArc.setAttribute('stroke-dashoffset',-b);}draw();work.onchange=move.onchange=draw;if(location.hash.length>1){const p=location.hash.substring(1).split(',');startTime=+p[0];work.value=p[1];move.value=p[2];draw();startBtn.style.display='none';}startBtn.onclick=()=>{startTime=Math.floor(Date.now()/1000);location.hash=startTime+','+work.value+','+move.value;startBtn.style.display='none';beep(1);};copyBtn.onclick=()=>navigator.clipboard.writeText(location.href);fsBtn.onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();};setInterval(()=>{if(!startTime)return;const W=+work.value*60,M=+move.value*60,T=W+M;let pos=(Math.floor(Date.now()/1000)-startTime)%T;let workf=pos<W;let rem=workf?W-pos:T-pos;let ph=workf?'w':'r';if(last&&last!==ph)beep(ph==='r'?3:1);last=ph;timer.textContent=String(Math.floor(rem/60)).padStart(2,'0')+':'+String(rem%60).padStart(2,'0');if(workf){line1.textContent='😊 WERKEN';line2.textContent='';}else{line1.textContent='✅ OPRUIMEN';line2.textContent='👣 DOORSCHUIVEN';}hand.setAttribute('transform','rotate('+(pos/T*360)+' 250 250)');},1000);</script></body></html>
