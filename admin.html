<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hoekenwerktimer</title><style>body{margin:0;font-family:Arial;text-align:center;background:#eef7ee}#top{padding:10px;background:white}input{width:60px;font-size:18px}button{font-size:16px;padding:8px 12px;margin:4px}svg{width:85vmin;height:85vmin}.time{font-size:60px;font-weight:bold}.label{font-size:26px;font-weight:bold}</style></head><body><div id="top">Werktijd <input id="work" value="8" type="number"> Doorschuiven <input id="move" value="2" type="number"> Rondes <input id="rounds" value="3" type="number"><br><button id="prev">◀ Vorige</button><button id="start">▶ Start</button><button id="pause">⏸ Pauze</button><button id="reset">⏹ Reset</button><button id="next">▶ Volgende</button><button id="fs">⛶ Fullscreen</button></div><h2 id="roundTxt">RONDE 1 / 3</h2><svg viewBox="0 0 500 500"><circle cx="250" cy="250" r="180" fill="none" stroke="#ddd" stroke-width="40"/><circle id="greenArc" cx="250" cy="250" r="180" fill="none" stroke="#2eaf4a" stroke-width="40" transform="rotate(-90 250 250)"/><circle id="redArc" cx="250" cy="250" r="180" fill="none" stroke="#e53935" stroke-width="40" transform="rotate(-90 250 250)"/><line id="hand" x1="250" y1="250" x2="250" y2="90" stroke="#222" stroke-width="10"/><circle cx="250" cy="250" r="12" fill="#222"/><text id="line1" x="250" y="180" text-anchor="middle" class="label">😊 WERKEN</text><text id="line2" x="250" y="215" text-anchor="middle" class="label"></text><text id="clock" x="250" y="300" text-anchor="middle" class="time">08:00</text></svg><script>function beep(n){try{const a=new(window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=a.createOscillator();o.connect(a.destination);o.frequency.value=850;o.start(a.currentTime+i*0.25);o.stop(a.currentTime+i*0.25+0.12)}}catch(e){}}const C=2*Math.PI*180;let run=false,round=1,pos=0;function drawSegments(){let w=+work.value,m=+move.value,t=w+m,b=C*(w/t),r=C*(m/t);greenArc.setAttribute('stroke-dasharray',b+' '+C);redArc.setAttribute('stroke-dasharray',r+' '+C);redArc.setAttribute('stroke-dashoffset',-b);}drawSegments();work.onchange=move.onchange=drawSegments;function update(){let W=+work.value*60,M=+move.value*60,T=W+M;let phase=pos<W?'work':'move';let rem=phase==='work'?W-pos:T-pos;clock.textContent=String(Math.floor(rem/60)).padStart(2,'0')+':'+String(rem%60).padStart(2,'0');roundTxt.textContent='RONDE '+round+' / '+rounds.value;hand.setAttribute('transform','rotate('+(pos/T*360)+' 250 250)');if(phase==='work'){line1.textContent='😊 WERKEN';line2.textContent='';document.body.style.background=rem<=60?'#ffe59a':'#eef7ee';}else{line1.textContent='✅ OPRUIMEN';line2.textContent='👣 DOORSCHUIVEN';document.body.style.background='#ffe0e0';}}start.onclick=()=>{run=true;beep(1)};pause.onclick=()=>run=false;reset.onclick=()=>{run=false;round=1;pos=0;update()};next.onclick=()=>{let W=+work.value*60;if(pos<W){pos=W;beep(3);}else{round++;pos=0;beep(1);}update();};prev.onclick=()=>{let W=+work.value*60;if(pos>=W)pos=0;else if(round>1){round--;pos=W;}update();};fs.onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();};setInterval(()=>{if(!run)return;let T=(+work.value + +move.value)*60;let wasWork=pos<(+work.value*60);pos++;if(pos>=T){round++;pos=0;beep(1);if(pos>=T){

    if(round >= +rounds.value){

        run = false;

        document.body.style.background = '#dff7df';

        roundTxt.textContent = '';

        line1.textContent = '✅ ✅ ✅';

        line2.textContent =
            'HOEKENWERK IS AFGELOPEN';

        clock.textContent = '🎉';

        beep(5);

        return;
    }

    round++;
    pos = 0;

    beep(1);
}let nowWork=pos<(+work.value*60);if(wasWork&&!nowWork)beep(3);update();},1000);update();</script></body></html>
